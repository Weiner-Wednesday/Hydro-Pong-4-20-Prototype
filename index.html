<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Thirsty Thursday: Hydro Pong</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#35c7f4;touch-action:none;user-select:none}
canvas{display:block}
#ui{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:white;font-weight:bold;text-shadow:2px 2px 5px black;z-index:10;pointer-events:none}
#score{font-size:22px;line-height:1.35}
#title{text-align:right;font-size:24px;line-height:1.2}
#message{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:white;font-size:24px;font-weight:bold;text-shadow:2px 2px 5px black;z-index:10;pointer-events:none;padding:0 20px;line-height:1.3}
#reset{position:fixed;left:12px;top:95px;z-index:20;border:0;border-radius:14px;padding:10px 15px;font-size:18px;font-weight:bold;background:white;color:#0077b6;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer}
#winBanner{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.52);color:white;font-weight:bold;text-align:center;text-shadow:3px 3px 7px black;align-items:center;justify-content:center;flex-direction:column;font-size:58px}
#winBanner span{font-size:30px;margin-top:15px}
</style>
</head>

<body>
<div id="ui">
  <div id="score">You: 0<br>Rival: 0<br>Turn: You</div>
  <div id="title">💦 Thirsty Thursday<br>Hydro Pong</div>
</div>

<button id="reset">Reset</button>
<div id="message">Tap once for sound. Drag back from the water ball. Aim at cups. Hit Rival for splash chaos.</div>
<div id="winBanner">FULLY HYDRATED! 💦<span>You win!</span></div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const message=document.getElementById("message");
const resetBtn=document.getElementById("reset");
const winBanner=document.getElementById("winBanner");

let W,H,table={},playerScore=0,rivalScore=0,turn="player",dragging=false,dragStart=null,dragNow=null;
let splashes=[],confetti=[],ballTrail=[],sinkAnim=null,hitFlash=0,crowd=[],audioCtx=null;

const GRAVITY=.58,CUP_OPENING=35,CUP_ASSIST=48;

const ball={x:0,y:0,z:0,r:14,vx:0,vy:0,vz:0,active:false,owner:"player",bounced:false,sinking:false};
let playerCups=[],rivalCups=[];

let playerPin={x:0,y:0,wet:0,talk:"",talkTime:0,wobble:0,shake:0};
let rivalPin={x:0,y:0,wet:0,talk:"",talkTime:0,wobble:0,shake:0};

resetBtn.onclick=resetGame;
window.addEventListener("resize",resize);

function startAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}

function tone(freq,dur,type="sine",vol=.06){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}

function noise(dur=.25,vol=.08){
  if(!audioCtx)return;
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*vol;
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain();
  src.buffer=buffer;src.connect(g);g.connect(audioCtx.destination);
  src.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
}

function sfx(type){
  if(type==="throw"){tone(280,.08,"triangle");tone(520,.12,"sine")}
  if(type==="bounce"){tone(150,.08,"square",.04)}
  if(type==="splash"){noise(.28,.13);tone(420,.12,"sine",.04)}
  if(type==="miss"){tone(150,.18,"sawtooth",.04);setTimeout(()=>tone(100,.18,"sawtooth",.035),100)}
  if(type==="cheer"){for(let i=0;i<10;i++)setTimeout(()=>tone(350+Math.random()*600,.12,"sine",.035),i*45);noise(.35,.04)}
  if(type==="heckle"){for(let i=0;i<5;i++)setTimeout(()=>tone(110+Math.random()*100,.14,"sawtooth",.032),i*70)}
  if(type==="win"){for(let i=0;i<14;i++)setTimeout(()=>tone(300+i*45,.12,"triangle",.055),i*65);noise(.9,.09)}
  if(type==="hit"){noise(.6,.18);tone(90,.22,"square",.06);setTimeout(()=>tone(70,.22,"square",.05),90)}
}

function resize(){
  W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H;resetGame();
}

function resetGame(){
  winBanner.style.display="none";
  playerScore=0;rivalScore=0;turn="player";dragging=false;
  splashes=[];confetti=[];ballTrail=[];sinkAnim=null;hitFlash=0;

  table.w=Math.min(W*.78,960);
  table.h=Math.min(H*.58,450);
  table.x=W/2-table.w/2;
  table.y=H/2-table.h/2+35;

  playerPin.x=table.x-125;
  playerPin.y=table.y+table.h/2;
  rivalPin.x=table.x+table.w+125;
  rivalPin.y=table.y+table.h/2;

  setupCrowd();
  setupCups();
  returnBallToPlayer();
  updateScore();

  say(playerPin,"Hydrate or hesitate!");
  say(rivalPin,"Try not to miss.");

  message.innerText="4:20 Prototype Build • Drag back from the water ball • Sink cups • Soak Rival";
}

function setupCrowd(){
  crowd=[];

  const spots=[
    [table.x+80,table.y-70],
    [table.x+table.w/2,table.y-86],
    [table.x+table.w-80,table.y-70],
    [table.x+100,table.y+table.h+78],
    [table.x+table.w/2,table.y+table.h+92],
    [table.x+table.w-100,table.y+table.h+78]
  ];

  const colors=["#1d3557","#7209b7","#111111","#f72585","#3a0ca3","#2b2d42"];
  const lines=["That was weak!","Sink it!","Boooo!","Nice form!","Hydrate!","Aim better!"];

  for(let i=0;i<spots.length;i++){
    crowd.push({
      x:spots[i][0],
      y:spots[i][1],
      line:lines[i],
      bounce:Math.random()*99,
      talk:0,
      mood:i%2,
      color:colors[i%colors.length],
      spin:Math.random()*6
    });
  }
}

function setupCups(){
  playerCups=[];rivalCups=[];
  const cy=table.y+table.h/2,leftX=table.x+120,rightX=table.x+table.w-120,gap=58;

  playerCups.push(cup(leftX,cy-gap),cup(leftX,cy),cup(leftX,cy+gap),cup(leftX+60,cy-gap/2),cup(leftX+60,cy+gap/2),cup(leftX+120,cy));
  rivalCups.push(cup(rightX,cy-gap),cup(rightX,cy),cup(rightX,cy+gap),cup(rightX-60,cy-gap/2),cup(rightX-60,cy+gap/2),cup(rightX-120,cy));
}

function cup(x,y){return{x,y,hit:false,wobble:0,sinkFlash:0};}

function updateScore(){
  scoreEl.innerHTML="You: "+playerScore+"<br>Rival: "+rivalScore+"<br>Turn: "+(turn==="player"?"You":"Rival");
}

function returnBallToPlayer(){
  Object.assign(ball,{x:table.x-62,y:table.y+table.h/2,z:0,vx:0,vy:0,vz:0,active:false,owner:"player",bounced:false,sinking:false});
}

function returnBallToRival(){
  Object.assign(ball,{x:table.x+table.w+62,y:table.y+table.h/2,z:0,vx:0,vy:0,vz:0,active:false,owner:"rival",bounced:false,sinking:false});
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#3ddcff");
  g.addColorStop(.55,"#8ff3ff");
  g.addColorStop(1,"#ffc15e");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.35)";
  ctx.font="bold 32px Arial";
  ctx.fillText("STAY HYDRATED",W/2-145,82);
}

function drawCrowd(){
  for(const c of crowd){
    c.bounce+=.05;
    c.spin+=.025;
    if(c.talk>0)c.talk--;

    const bob=Math.sin(c.bounce)*4;

    ctx.save();
    ctx.translate(c.x,c.y+bob);
    ctx.rotate(Math.sin(c.spin)*0.08);

    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();
    ctx.ellipse(4,27,24,7,0,0,Math.PI*2);
    ctx.fill();

    const grad=ctx.createRadialGradient(-9,-10,5,0,0,34);
    grad.addColorStop(0,"#ffffff");
    grad.addColorStop(.18,c.color);
    grad.addColorStop(1,"#050505");

    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,31,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.75)";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,0,31,0,Math.PI*2);
    ctx.stroke();

    ctx.fillStyle="#050505";
    ctx.beginPath();
    ctx.arc(-8,-8,4,0,Math.PI*2);
    ctx.arc(6,-10,4,0,Math.PI*2);
    ctx.arc(-1,4,4,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(-9,-9,1.2,0,Math.PI*2);
    ctx.arc(5,-11,1.2,0,Math.PI*2);
    ctx.arc(-2,3,1.2,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.75)";
    ctx.lineWidth=4;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(-23,14);
    ctx.lineTo(-38,-2);
    ctx.moveTo(23,14);
    ctx.lineTo(38,-2);
    ctx.stroke();

    ctx.fillStyle="rgba(255,255,255,.95)";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";
    ctx.fillText("BB",0,48);
    ctx.textAlign="left";

    ctx.restore();

    if(c.talk>0)drawSpeech(c.x,c.y-50,c.line,15);
  }
}

function crowdReact(type){
  const cheer=["SPLASH!","LET'S GO!","HYDRATE!","THAT WAS CLEAN!","WOOOO!","HE'S HEATING UP!"];
  const heckle=["AIR BALL!","THAT WAS WEAK!","AIM BETTER!","MY GRANDMA THROWS HARDER!","BOOOOO!","YOU CALL THAT A SHOT?!"];
  const hit=["DIRECT HIT!","HE GOT SOAKED!","WATER YOU DOING?!","ABSOLUTE CHAOS!","SPLASH DAMAGE!","HE'S DRENCHED!"];

  let list=cheer;
  if(type==="miss")list=heckle;
  if(type==="hit")list=hit;

  for(const c of crowd){
    if(Math.random()<.9){
      c.line=list[Math.floor(Math.random()*list.length)];
      c.talk=130;
    }
  }

  const chosen=list[Math.floor(Math.random()*list.length)];
  message.innerText=chosen;

  if(type==="score")sfx("cheer");
  if(type==="miss")sfx("heckle");
  if(type==="hit")sfx("hit");
}

function drawTable(){
  ctx.fillStyle="#0797c9";roundRect(table.x,table.y,table.w,table.h,38);ctx.fill();
  ctx.strokeStyle="white";ctx.lineWidth=7;roundRect(table.x,table.y,table.w,table.h,38);ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(table.x+table.w/2,table.y+20);ctx.lineTo(table.x+table.w/2,table.y+table.h-20);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.15)";roundRect(table.x+24,table.y+24,table.w-48,table.h-48,28);ctx.fill();
}

function drawCharacters(){drawPin(playerPin,"YOU","#00b4d8");drawPin(rivalPin,"RIVAL","#ff006e");}

function drawPin(pin,label,accent){
  pin.wobble*=.88;pin.wet*=.94;pin.shake*=.82;
  if(pin.talkTime>0)pin.talkTime--;

  const shakeX=(Math.random()-.5)*pin.shake*1.6;
  const shakeY=(Math.random()-.5)*pin.shake*1.2;

  ctx.save();
  ctx.translate(pin.x+shakeX,pin.y+shakeY);
  ctx.rotate(Math.sin(pin.wobble)*.08);

  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();ctx.ellipse(0,82,48,12,0,0,Math.PI*2);ctx.fill();

  const grad=ctx.createLinearGradient(-45,-78,45,115);
  grad.addColorStop(0,"#fff");
  grad.addColorStop(.5,"#fff8e7");
  grad.addColorStop(1,"#ddd4c2");

  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,-80);
  ctx.bezierCurveTo(45,-72,35,-8,20,22);
  ctx.bezierCurveTo(66,45,49,116,0,116);
  ctx.bezierCurveTo(-49,116,-66,45,-20,22);
  ctx.bezierCurveTo(-35,-8,-45,-72,0,-80);
  ctx.fill();

  ctx.strokeStyle="#222";ctx.lineWidth=3;ctx.stroke();

  ctx.fillStyle=accent;
  ctx.beginPath();ctx.ellipse(0,-20,32,10,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#111";
  ctx.beginPath();ctx.arc(-12,-46,4,0,Math.PI*2);ctx.arc(12,-46,4,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle="#111";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-34,13,0,Math.PI);ctx.stroke();

  if(pin.wet>1){
    ctx.fillStyle="rgba(0,180,216,.5)";
    ctx.beginPath();ctx.ellipse(0,8,37,70,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.8)";
    for(let i=0;i<10;i++){
      ctx.beginPath();ctx.arc(-25+i*6,-25+Math.sin(i+pin.wet)*45,3.8,0,Math.PI*2);ctx.fill();
    }
  }

  ctx.fillStyle="white";
  ctx.font="bold 16px Arial";
  ctx.textAlign="center";
  ctx.fillText(label,0,-98);
  ctx.textAlign="left";

  ctx.restore();

  if(pin.talkTime>0)drawSpeech(pin.x,pin.y-138,pin.talk,18);
}

function drawSpeech(x,y,text,size){
  ctx.font="bold "+size+"px Arial";
  const w=ctx.measureText(text).width+28;

  ctx.fillStyle="rgba(255,255,255,.97)";
  roundRect(x-w/2,y-28,w,40,14);ctx.fill();

  ctx.strokeStyle="#111";ctx.lineWidth=3;
  roundRect(x-w/2,y-28,w,40,14);ctx.stroke();

  ctx.fillStyle="#111";
  ctx.textAlign="center";
  ctx.fillText(text,x,y-2);
  ctx.textAlign="left";
}

function say(pin,text){pin.talk=text;pin.talkTime=120;}

function drawCup(c){
  if(c.hit)return;
  ctx.save();
  c.wobble*=.85;c.sinkFlash*=.88;
  ctx.translate(c.x,c.y);
  ctx.rotate(Math.sin(c.wobble)*.10);

  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();ctx.ellipse(3,12,31,36,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#d90429";
  ctx.beginPath();
  ctx.moveTo(-31,-26);
  ctx.quadraticCurveTo(0,-40,31,-26);
  ctx.lineTo(22,36);
  ctx.quadraticCurveTo(0,47,-22,36);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="white";ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(0,-25,31,14,0,0,Math.PI*2);ctx.stroke();

  ctx.fillStyle="#111";
  ctx.beginPath();ctx.ellipse(0,-25,CUP_OPENING,16,0,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.95)";ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,-25,CUP_OPENING,16,0,0,Math.PI*2);ctx.stroke();

  ctx.fillStyle="rgba(255,255,255,.2)";
  ctx.beginPath();ctx.ellipse(-13,2,7,22,-.25,0,Math.PI*2);ctx.fill();

  if(c.sinkFlash>1){
    ctx.fillStyle="rgba(72,202,228,.65)";
    ctx.beginPath();ctx.ellipse(0,-25,CUP_OPENING+c.sinkFlash,16+c.sinkFlash/2,0,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function drawBall(){
  for(let i=0;i<ballTrail.length;i++){
    const p=ballTrail[i];
    ctx.fillStyle="rgba(0,180,216,"+(i/ballTrail.length)*.35+")";
    ctx.beginPath();ctx.arc(p.x,p.y-p.z,ball.r*.7,0,Math.PI*2);ctx.fill();
  }

  const screenY=ball.y-ball.z;

  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();ctx.ellipse(ball.x,ball.y+15,ball.r+4,7,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#00b4d8";
  ctx.beginPath();ctx.arc(ball.x,screenY,ball.r,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="rgba(255,255,255,.8)";
  ctx.beginPath();ctx.arc(ball.x-5,screenY-6,5,0,Math.PI*2);ctx.fill();
}

function drawAim(){
  if(!dragging||!dragStart||!dragNow)return;

  const dx=dragStart.x-dragNow.x;
  const dy=dragStart.y-dragNow.y;

  ctx.strokeStyle="rgba(255,255,255,.95)";
  ctx.lineWidth=5;
  ctx.setLineDash([12,10]);
  ctx.beginPath();
  ctx.moveTo(ball.x,ball.y);
  ctx.lineTo(ball.x+dx*4.2,ball.y+dy*4.2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle="#ffbe0b";
  ctx.font="bold 20px Arial";
  ctx.fillText("AIM",ball.x-22,ball.y-35);
}

function pointer(e){
  if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}

function down(e){
  startAudio();
  if(turn!=="player"||ball.active||ball.sinking)return;

  const p=pointer(e);
  if(Math.hypot(p.x-ball.x,p.y-ball.y)>120)return;

  dragging=true;
  dragStart={x:ball.x,y:ball.y};
  dragNow=p;
  message.innerText="Pull left/back, aim at the cup opening!";
}

function move(e){
  if(!dragging)return;

  const p=pointer(e);
  let dx=p.x-dragStart.x;
  let dy=p.y-dragStart.y;
  const max=220;
  const dist=Math.hypot(dx,dy);

  if(dist>max){
    const a=Math.atan2(dy,dx);
    dx=Math.cos(a)*max;
    dy=Math.sin(a)*max;
  }

  dragNow={x:dragStart.x+dx,y:dragStart.y+dy};
  ball.x=dragNow.x;
  ball.y=dragNow.y;
}

function up(){
  if(!dragging)return;
  dragging=false;

  const dx=dragStart.x-dragNow.x;
  const dy=dragStart.y-dragNow.y;

  Object.assign(ball,{x:dragStart.x,y:dragStart.y,z:0,vx:dx*.205,vy:dy*.205,vz:18.5,active:true,owner:"player",bounced:false,sinking:false});
  ballTrail=[];

  say(playerPin,"Hydro shot!");
  message.innerText="HYDRO SHOT!";
  sfx("throw");
}

function rivalThrow(){
  turn="rival";
  updateScore();
  returnBallToRival();
  message.innerText="Rival is lining up...";
  say(rivalPin,"Watch this!");

  setTimeout(()=>{
    const open=playerCups.filter(c=>!c.hit);
    const target=open[Math.floor(Math.random()*open.length)];

    let targetX=target.x;
    let targetY=target.y-25;

    const skill=Math.random();

    if(skill<.35){
      targetX+=(Math.random()-.5)*130;
      targetY+=(Math.random()-.5)*115;
    }else if(skill<.78){
      targetX+=(Math.random()-.5)*58;
      targetY+=(Math.random()-.5)*52;
    }else{
      targetX+=(Math.random()-.5)*24;
      targetY+=(Math.random()-.5)*24;
    }

    const frames=48;
    const dx=targetX-ball.x;
    const dy=targetY-ball.y;

    Object.assign(ball,{vx:dx/frames,vy:dy/frames,vz:16.8,z:0,active:true,owner:"rival",bounced:false,sinking:false});
    ballTrail=[];
    message.innerText="Rival throws!";
    sfx("throw");
  },900);
}

function updateBall(){
  if(!ball.active||ball.sinking)return;

  ball.vz-=GRAVITY;
  ball.x+=ball.vx;
  ball.y+=ball.vy;
  ball.z+=ball.vz;

  ballTrail.push({x:ball.x,y:ball.y,z:ball.z});
  if(ballTrail.length>20)ballTrail.shift();

  const targetCups=ball.owner==="player"?rivalCups:playerCups;

  for(const c of targetCups){
    if(c.hit)continue;

    const d=Math.hypot(ball.x-c.x,ball.y-(c.y-25));

    if((d<CUP_OPENING&&ball.z<42&&ball.z>-8)||(d<CUP_ASSIST&&ball.z<24&&ball.z>-8&&ball.bounced)){
      startSink(c);
      return;
    }
  }

  checkPlayerHit();

  const onTable=ball.x>table.x&&ball.x<table.x+table.w&&ball.y>table.y&&ball.y<table.y+table.h;

  if(ball.z<=0&&onTable&&!ball.bounced){
    ball.z=0;
    ball.vz=9.2;
    ball.vx*=.78;
    ball.vy*=.78;
    ball.bounced=true;
    splash(ball.x,ball.y,16);
    message.innerText="Bounce!";
    sfx("bounce");
  }

  if(ball.z<=-18&&ball.bounced)miss();

  if(ball.x<-150||ball.x>W+150||ball.y<-150||ball.y>H+150||ball.z<-120)miss();
}

function checkPlayerHit(){
  const targetPin=ball.owner==="player"?rivalPin:playerPin;
  const screenY=ball.y-ball.z;
  const bodyDist=Math.hypot(ball.x-targetPin.x,screenY-targetPin.y);

  const nearRival=ball.owner==="player"&&ball.x>table.x+table.w+15&&Math.abs(screenY-targetPin.y)<95;
  const nearPlayer=ball.owner==="rival"&&ball.x<table.x-15&&Math.abs(screenY-targetPin.y)<95;

  if(bodyDist<78||nearRival||nearPlayer)dramaticHit(targetPin);
}

function dramaticHit(pin){
  ball.active=false;
  ballTrail=[];

  pin.wet=65;
  pin.wobble=28;
  pin.shake=34;
  hitFlash=28;

  bigSplash(pin.x,pin.y-15);
  crowdReact("hit");
  sfx("hit");

  if(pin===rivalPin){
    say(rivalPin,"I'M SOAKED!");
    say(playerPin,"HYDRATION ACTIVATED!");
    message.innerText="DIRECT HIT! Rival got drenched!";

    setTimeout(()=>{
      rivalPin.shake=0;
      rivalThrow();
    },1400);
  }else{
    say(playerPin,"TOO COLD!");
    say(rivalPin,"GET HYDRATED!");
    message.innerText="DIRECT HIT! You got soaked!";
    turn="player";
    updateScore();

    setTimeout(()=>{
      playerPin.shake=0;
      returnBallToPlayer();
      message.innerText="Your turn!";
    },1400);
  }
}

function startSink(cupHit){
  ball.active=false;
  ball.sinking=true;
  ballTrail=[];
  cupHit.sinkFlash=16;

  sinkAnim={cup:cupHit,owner:ball.owner,frame:0,startX:ball.x,startY:ball.y,startZ:ball.z};
  message.innerText="IN THE CUP!";
  sfx("splash");
}

function updateSink(){
  if(!sinkAnim)return;

  sinkAnim.frame++;
  const p=sinkAnim.frame/22;
  const c=sinkAnim.cup;
  const cupOpenY=c.y-25;

  ball.x=sinkAnim.startX+(c.x-sinkAnim.startX)*p;
  ball.y=sinkAnim.startY+(cupOpenY-sinkAnim.startY)*p;
  ball.z=sinkAnim.startZ*(1-p);

  if(p>=1){
    finishScore(c,sinkAnim.owner);
    sinkAnim=null;
    ball.sinking=false;
  }
}

function finishScore(cupHit,owner){
  cupHit.hit=true;
  cupHit.wobble=18;
  splash(cupHit.x,cupHit.y-25,48);
  crowdReact("score");

  if(owner==="player"){
    playerScore++;
    say(playerPin,"That’s hydration!");
    say(rivalPin,"Lucky shot.");
    message.innerText="SPLASH! You scored!";
    updateScore();

    if(playerScore>=6){
      winner("YOU WIN!","FULLY HYDRATED!");
      return;
    }

    setTimeout(rivalThrow,950);
  }else{
    rivalScore++;
    say(rivalPin,"Too easy!");
    say(playerPin,"Run it back!");
    message.innerText="Rival scored!";
    updateScore();

    if(rivalScore>=6){
      winner("RIVAL WINS!","REMATCH TIME!");
      return;
    }

    turn="player";
    updateScore();

    setTimeout(()=>{
      returnBallToPlayer();
      message.innerText="Your turn!";
    },950);
  }
}

function miss(){
  if(!ball.active)return;

  ball.active=false;
  ballTrail=[];
  splash(ball.x,ball.y,26);
  crowdReact("miss");
  sfx("miss");

  if(ball.owner==="player"){
    say(rivalPin,"That was embarrassing.");
    message.innerText="Miss! Rival turn.";
    setTimeout(rivalThrow,850);
  }else{
    say(playerPin,"Nice miss!");
    message.innerText="Rival missed! Your turn.";
    turn="player";
    updateScore();

    setTimeout(()=>{
      returnBallToPlayer();
      message.innerText="Your turn!";
    },850);
  }
}

function winner(big,small){
  winBanner.innerHTML=big+" 💦<span>"+small+"<br><br>4:20 Prototype Build</span>";
  winBanner.style.display="flex";
  makeConfetti();
  message.innerText="Thanks for playing Hydro Pong Prototype!";
  sfx("win");
  setTimeout(resetGame,5200);
}

function splash(x,y,amount){
  for(let i=0;i<amount;i++){
    splashes.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:38,size:Math.random()*5+3});
  }
}

function bigSplash(x,y){
  for(let i=0;i<220;i++){
    splashes.push({x,y,vx:(Math.random()-.5)*28,vy:(Math.random()-.5)*28,life:80,size:Math.random()*12+5});
  }
}

function updateSplashes(){
  for(const s of splashes){
    s.x+=s.vx;
    s.y+=s.vy;
    s.vx*=.97;
    s.vy*=.97;
    s.life--;
  }
  splashes=splashes.filter(s=>s.life>0);
}

function drawSplashes(){
  for(const s of splashes){
    ctx.fillStyle="rgba(255,255,255,"+s.life/80+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();

    ctx.fillStyle="rgba(0,180,216,"+s.life/80+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.size*.6,0,Math.PI*2);ctx.fill();
  }
}

function makeConfetti(){
  for(let i=0;i<180;i++){
    confetti.push({
      x:Math.random()*W,
      y:-Math.random()*H,
      vx:(Math.random()-.5)*6,
      vy:Math.random()*5+3,
      size:Math.random()*8+5,
      life:180,
      color:["#ffbe0b","#ff006e","#00b4d8","#ffffff","#80ed99"][Math.floor(Math.random()*5)]
    });
  }
}

function updateConfetti(){
  for(const c of confetti){
    c.x+=c.vx;
    c.y+=c.vy;
    c.life--;
  }
  confetti=confetti.filter(c=>c.life>0);
}

function drawConfetti(){
  for(const c of confetti){
    ctx.fillStyle=c.color;
    ctx.fillRect(c.x,c.y,c.size,c.size);
  }
}

function drawHitFlash(){
  if(hitFlash<=0)return;
  ctx.fillStyle="rgba(255,255,255,"+hitFlash/38+")";
  ctx.fillRect(0,0,W,H);
  hitFlash--;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
}

canvas.addEventListener("mousedown",down);
canvas.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);

canvas.addEventListener("touchstart",e=>{
  e.preventDefault();
  down(e);
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  move(e);
},{passive:false});

window.addEventListener("touchend",up);

function loop(){
  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawCrowd();
  drawTable();

  playerCups.forEach(drawCup);
  rivalCups.forEach(drawCup);

  drawCharacters();
  drawAim();
  drawBall();

  updateBall();
  updateSink();

  updateSplashes();
  drawSplashes();

  updateConfetti();
  drawConfetti();

  drawHitFlash();

  requestAnimationFrame(loop);
}

resize();
loop();
</script>
